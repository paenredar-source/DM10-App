<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f0e6;--card:#fffaf2;--ink:#2a190c;--muted:#7a6551;--line:#e2d3bf;--acc:#b0621f;--acc-d:#7a3f0e;--good:#3f7d3a;--warn:#b07d0a;--bad:#b3341f;
--pg:#2f7fb8;--pf:#3f8a3a;--pc:#9a4fb0;--title:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#1d130b;--card:#2a1d12;--ink:#f3e7d8;--muted:#b9a58f;--line:#43301f;--acc:#e0924a;--acc-d:#f2b27a;--pg:#63a8de;--pf:#72c06a;--pc:#c28ad6;--good:#7bc477;--warn:#e6b84a;--bad:#ee7d6c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:54px;height:54px;border-radius:10px;flex:none}
h1{font:700 38px/1 var(--title);margin:0}.sub{color:var(--muted);font-size:14px;margin-top:3px}
a{color:inherit}
#q{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:12px}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}
.kpilink{text-decoration:none;color:inherit;border-color:var(--acc);cursor:pointer}.kpilink:hover{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
a.tl{color:var(--acc-d);font-weight:600;text-decoration:none}
.libre{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:99px;color:var(--good);border:1px solid var(--good)}
.pb{display:inline-block;min-width:30px;text-align:center;font:700 14px/1 var(--title);letter-spacing:.3px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.p-G{--c:var(--pg)}.p-F{--c:var(--pf)}.p-C{--c:var(--pc)}
.pb.p-G,.pb.p-F,.pb.p-C{background:color-mix(in srgb,var(--c) 26%,transparent);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.pb.p-GF{background:linear-gradient(90deg,color-mix(in srgb,var(--pg) 28%,transparent) 50%,color-mix(in srgb,var(--pf) 28%,transparent) 50%);border-color:color-mix(in srgb,var(--pg) 40%,var(--pf))}
.pb.p-CF{background:linear-gradient(90deg,color-mix(in srgb,var(--pf) 28%,transparent) 50%,color-mix(in srgb,var(--pc) 28%,transparent) 50%);border-color:color-mix(in srgb,var(--pf) 40%,var(--pc))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chip{font:700 15px var(--title);letter-spacing:.3px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pcount{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}.pcount span{font-size:14px;color:var(--muted)}
.tablebox.p th,.tablebox.p td{padding:9px 5px}
.tablebox.p table.wide{min-width:600px}
.tablebox.p .c1{position:sticky;left:0;z-index:1;background:var(--card);width:44px;min-width:44px;max-width:44px}
.tablebox.p .c2{position:sticky;left:44px;z-index:1;background:var(--card);min-width:112px;box-shadow:1px 0 0 var(--line)}
.tsum{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.tsum.good{border-color:var(--good)}.tsum.warn{border-color:var(--warn)}.tsum.bad{border-color:var(--bad)}
.tv{font-weight:600;margin-bottom:6px}.good .tv{color:var(--good)}.warn .tv{color:var(--warn)}.bad .tv{color:var(--bad)}
.tsum table{font-size:14px;min-width:0}.tsum th{cursor:default;font-size:12px;padding:3px 4px;background:transparent;border-bottom:0}.tsum td{padding:3px 4px;border-bottom:0}
.tw{font-size:13px;color:var(--bad);margin-top:6px}
.tpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.tph{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.tph .lbl{font:700 22px var(--title)}
select{flex:1;min-width:0;font:500 16px var(--body);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.it{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}.it.on{background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.it input{accent-color:var(--acc);width:20px;height:20px;flex:none;margin:0}.it .in{flex:1;min-width:0}.it .iv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.sec{font:700 16px var(--title);color:var(--muted);padding:8px 10px 4px;letter-spacing:.4px}
.ngm{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}.ngm input{accent-color:var(--acc);width:18px;height:18px;margin:0}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools .btn{margin:0}
tr.mine td{background:color-mix(in srgb,var(--acc) 12%,var(--card))}
details.cd{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.cd summary{padding:11px 12px;font:700 19px var(--title);cursor:pointer;letter-spacing:.3px}.cb{padding:0 12px 10px}
.cb ul{margin:4px 0 10px;padding-left:18px;font-size:15px}.cb li{margin:2px 0}
.tcard{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:8px 0}.tcard .th{font:700 19px var(--title)}.tcard b{font-size:14px;color:var(--muted)}
details.per{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}details.per>summary{font-size:20px}details.per .cd{background:var(--paper)}
.cb .tn{font:700 17px var(--title);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 28px/1.05 var(--title);font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:14px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 14px var(--body);color:var(--muted);cursor:pointer;user-select:none;background:var(--card)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}th.ns{cursor:default}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
td.nm{white-space:normal;min-width:90px;overflow-wrap:anywhere}
.tablebox.l th,.tablebox.l td{padding:10px 6px}
.team{font:600 19px/1.05 var(--title);letter-spacing:.3px;display:block}.gm{color:var(--muted);font-size:12px}
.pos{display:block;color:var(--muted);font-size:12px}
.free{font:700 21px/1 var(--title)}.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
.bg-warn i{background:var(--warn)}.bg-bad i{background:var(--bad)}
.badge{display:inline-block;min-width:26px;text-align:center;font:600 13px var(--body);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.y1{background:color-mix(in srgb,var(--warn) 20%,transparent)}.y2{background:color-mix(in srgb,var(--acc) 16%,transparent)}.y3{background:color-mix(in srgb,var(--good) 22%,transparent)}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;text-decoration:none;display:inline-block;margin-bottom:12px}
.head{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.head h2{font:700 34px/1 var(--title);margin:0 0 4px}.head .big{font:700 44px/1 var(--title);font-variant-numeric:tabular-nums;margin-top:10px}
.head .bar{height:10px;border-radius:5px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:8px}
h3{font:700 22px/1 var(--title);margin:18px 0 8px;letter-spacing:.3px}
tfoot td{font-weight:600;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.empty{color:var(--muted);font-style:italic}.note{color:var(--muted);font-size:13px}.err{color:var(--bad);font-weight:600}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=1)=>Number(n).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,sort={key:"name",dir:1},fs={key:"fppg",dir:-1},query="",pf=new Set(),ps={key:"sal",dir:-1},rs={key:"name",dir:1};
const POS=["G","GF","F","CF","C"],rank=p=>{const i=POS.indexOf(String(p||"").toUpperCase());return i<0?9:i};
const pb=p=>POS.includes(p)?`<span class="pb p-${p}">${p}</span>`:`<span class="empty">–</span>`;
const nul=(v,d)=>v??(d>0?9999:-9999);
const prk=(a,b,d)=>{const x=rank(a),y=rank(b);return x===9||y===9?x-y:(x-y)*d};
function psort(list,k,d){
  return [...list].sort((a,b)=>{
    let r=k==="name"?String(a.name).localeCompare(String(b.name),"es")*d
         :k==="pos"?prk(a.pos,b.pos,d)
         :(nul(a[k],d)-nul(b[k],d))*d;
    return r||b.sal-a.sal||String(a.name).localeCompare(String(b.name),"es");
  });
}
const pdir=k=>k==="name"||k==="age"||k==="pos"?1:-1;
const st=(p)=>`<td class="num">${p.fppg!=null?fmt(p.fppg):"–"}</td><td class="num">${p.fppm!=null?fmt(p.fppm,2):"–"}</td><td class="num">${p.mpg!=null?fmt(p.mpg):"–"}</td>`;
const level=f=>f<=0?"bad":f<=10?"warn":"good";
const bar=(f,cap,h)=>{const l=level(f);return `<div class="bar ${l==="good"?"":"bg-"+l}" ${h?`style="height:${h}px"`:""}><i style="width:${Math.max(0,Math.min(100,f/cap*100))}%"></i></div>`};
const short=n=>String(n).replace(/\s*\([^)]*\)\s*$/,"");
const key=t=>t.abbr||t.name;

function listView(){
  const cap=D.meta.cap,T=[...D.teams],k=sort.key,d=sort.dir;
  T.sort((a,b)=>k==="name"?short(a.name).localeCompare(short(b.name),"es")*d:((a[k]??0)-(b[k]??0))*d);
  const arrow=x=>sort.key===x?(sort.dir>0?" ↑":" ↓"):"";
  const avg=T.reduce((s,t)=>s+t.libre,0)/(T.length||1);
  const rows=T.map(t=>`<tr class="row${key(t)===mine?" mine":""}" tabindex="0" data-t="${esc(key(t))}">
   <td class="nm"><span class="team">${key(t)===mine?"★ ":""}${esc(short(t.name))}</span><span class="gm">${esc(t.gm||"")}</span></td>
   <td class="num">${fmt(t.salarios)}</td>
   <td class="num"><span class="free c-${level(t.libre)}">${fmt(t.libre)}</span>${bar(t.libre,cap)}</td>
   <td class="num">${t.players.length}<span class="empty"> / ${D.meta.rosterMax}</span></td></tr>`).join("");
  return `<div class="kpis"><div class="kpi"><b>${T.length}</b><span>Equipos</span></div>
   <div class="kpi"><b>${fmt(avg)} M</b><span>Libre medio</span></div><a class="kpi kpilink" href="#libres"><b>${(D.libres||[]).length}</b><span>Agentes libres ›</span></a></div>
  <div class="tools"><a class="btn" href="#trade">⇄ Simulador de trades</a><a class="btn" href="#cambios">🔄 Cambios${chCount((D.history||[])[0])?` (${chCount(D.history[0])})`:""}</a>${mine&&tTeam(mine)?`<a class="btn" href="#team=${encodeURIComponent(mine)}">★ Mi equipo</a>`:""}</div>
  <div class="tablebox l"><table><thead><tr><th data-s="name">Equipo${arrow("name")}</th><th class="num" data-s="salarios">Sal. M${arrow("salarios")}</th>
   <th class="num" data-s="libre">Libre M${arrow("libre")}</th><th class="num" data-s="n">Jug.${arrow("n")}</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note">Toca un equipo para ver su plantilla. Pulsa las cabeceras para ordenar.</div>`;
}
function ptable(list,stats){
  return list.map(p=>`<tr><td class="c1">${pb(p.pos)}</td><td class="nm c2">${esc(p.name)}</td>
   <td class="num">${fmt(p.sal)}</td><td class="num"><span class="badge y${p.yrs}">${p.yrs??"–"}</span></td><td class="num">${p.age??"–"}</td>${stats?st(p):""}</tr>`).join("");
}
let mine="";try{mine=localStorage.getItem("dm10_mi_equipo")||""}catch(e){}
const setMine=k=>{mine=k;try{k?localStorage.setItem("dm10_mi_equipo",k):localStorage.removeItem("dm10_mi_equipo")}catch(e){}};
let cs={mine:false},tradePre=false;
const chCount=e=>e?e.trades.length+e.fichajes.length+e.cortes.length+e.contratos.length:0;
function cambiosView(){
  const H=D.history||[],M=cs.mine&&mine,inv=k=>!M||k===mine;
  const tl=(k,n)=>`<a class="tl" href="#team=${encodeURIComponent(k)}">${esc(n)}</a>`;
  const ul=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  const grp=list=>{const m=new Map();for(const x of list.filter(x=>inv(x.k))){if(!m.has(x.k))m.set(x.k,{n:x.name,i:[]});m.get(x.k).i.push(x.text)}return m};
  const byTeam=list=>[...grp(list)].map(([k,v])=>`<div class="tn">${tl(k,v.n)}</div>${ul(v.i)}`).join("");
  const sec=(title,list,open,html)=>list===0?"":`<details class="cd"${open?" open":""}><summary>${title} (${list})</summary><div class="cb">${html}</div></details>`;
  const block=(e,i)=>{
    const T=e.trades.filter(x=>inv(x.a.k)||inv(x.b.k)),F=e.fichajes.filter(x=>inv(x.k)),C=e.cortes.filter(x=>inv(x.k)),K=e.contratos.filter(x=>inv(x.k));
    const trades=T.map(x=>`<div class="tcard"><div class="th">${tl(x.a.k,x.a.name)} ⇄ ${tl(x.b.k,x.b.name)}</div>${x.aSends.length?`<b>${esc(x.a.name)} envía</b>${ul(x.aSends)}`:""}${x.bSends.length?`<b>${esc(x.b.name)} envía</b>${ul(x.bSends)}`:""}</div>`).join("");
    const none=!T.length&&!F.length&&!C.length&&!K.length;
    const n=T.length+F.length+C.length+K.length;
    return `<details class="cd per"${i===0?" open":""}><summary>Del ${esc(e.desde||"?")} al ${esc(e.hasta||"?")} <span class="empty">· ${n} cambio${n===1?"":"s"}</span></summary><div class="cb">${none?`<p class="empty">Sin cambios${M?" para tu equipo":""}.</p>`:""}`
      +sec("Trades",T.length,i===0,trades)+sec("Fichajes",F.length,false,byTeam(e.fichajes))+sec("Cortes y bajas",C.length,false,byTeam(e.cortes))+sec("Contratos modificados",K.length,false,byTeam(e.contratos))+`</div></details>`;
  };
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>Cambios</h2><div class="sub">Historial de lo que ha cambiado entre cada actualización de la tabla y la anterior (${H.length} actualizaci${H.length===1?"ón guardada":"ones guardadas"}).</div>
   ${mine&&tTeam(mine)?`<div class="tools" style="margin:10px 0 0"><button class="chip${cs.mine?" on":""}" data-act="onlymine">Solo mi equipo</button></div>`:""}</div>
  ${H.length?H.map((e,i)=>block(e,i)).join(""):`<p class="empty">Aún no hay cambios registrados: aparecerán a partir de la próxima actualización.</p>`}`;
}
let tr={a:"",b:"",sel:{a:new Set(),b:new Set()},ngm:{a:false,b:false}};
const tTeam=k=>D.teams.find(t=>key(t)===k);
function side(s){
  const t=tTeam(tr[s]);if(!t)return null;const S=tr.sel[s];
  const out=t.players.filter(p=>S.has("p:"+p.name));
  const pk=(t.picks||[]).map((p,i)=>({...p,i})).filter(p=>S.has("k:"+p.i)),rt=(t.rights||[]).filter(r=>S.has("r:"+r.name));
  return{t,out,pk,rt,sent:out.reduce((a,p)=>a+p.sal,0),extra:pk.length+rt.length};
}
function panel(s){
  const t=tTeam(tr[s]),S=tr.sel[s],o=s==="a"?"b":"a";
  const opts=[...D.teams].sort((x,y)=>short(x.name).localeCompare(short(y.name),"es")).map(x=>`<option value="${esc(key(x))}"${key(x)===tr[s]?" selected":""}${key(x)===tr[o]?" disabled":""}>${esc(short(x.name))}</option>`).join("");
  let body="";
  if(t){
    body=`<label class="ngm"><input type="checkbox" data-ngm="${s}"${tr.ngm[s]?" checked":""}> Nuevo GM <span class="empty">${t.rookie?"(marcado como Rookie)":"(restricciones de 1ª ronda)"}</span></label>`;
    const it=(id,left,name,sal,y)=>{const on=S.has(id);return `<label class="it${on?" on":""}"><input type="checkbox" data-s="${s}" data-i="${esc(id)}"${on?" checked":""}>${left}<span class="in">${name}</span><span class="iv">${sal}</span>${y}</label>`};
    body+=`<div class="sec">Jugadores</div>`+[...t.players].sort((a,b)=>b.sal-a.sal).map(p=>it("p:"+p.name,pb(p.pos),esc(p.name),fmt(p.sal)+" M",`<span class="badge y${p.yrs}">${p.yrs??"–"}</span>`)).join("");
    const pk=(t.picks||[]).map((p,i)=>({...p,i})).sort((a,b)=>a.year-b.year||a.rnd-b.rnd||(a.pick??999)-(b.pick??999));
    if(pk.length)body+=`<div class="sec">Picks (sin valor salarial)</div>`+pk.map(p=>it("k:"+p.i,`<span class="pb">${p.year}</span>`,`R${p.rnd}${p.pick!=null?" #"+p.pick:""} · ${p.from?esc(short(p.from)):"Propio"}`,"","")).join("");
    if((t.rights||[]).length)body+=`<div class="sec">Derechos (sin valor salarial)</div>`+t.rights.map(r=>it("r:"+r.name,pb(r.pos),esc(r.name),"","")).join("");
  }else body=`<div class="empty" style="padding:12px">Elige un equipo.</div>`;
  return `<div class="tpanel"><div class="tph"><span class="lbl">${s==="a"?"A":"B"}</span><select data-sel="${s}"><option value="">Elegir equipo…</option>${opts}</select></div>${body}</div>`;
}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true}
  catch(e){const ta=document.createElement("textarea");ta.value=s;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}
let tradeText="";
function tradeView(){
  const A=side("a"),B=side("b"),max=D.meta.rosterMax;let sum;tradeText="";
  if(!A||!B)sum=`<div class="tsum"><div class="tv" style="color:var(--muted)">Elige dos equipos y marca lo que envía cada uno.</div></div>`;
  else{
    const diff=Math.abs(A.sent-B.sent),tol=Math.max(2,.25*Math.max(A.sent,B.sent)),ok=diff<=tol+1e-9,any=A.out.length+B.out.length+A.extra+B.extra>0;
    const rows=[[A,B],[B,A]].map(([x,y])=>{
      const libre=x.t.libre+x.sent-y.sent,n=x.t.players.length-x.out.length+y.out.length;
      const warns=[];
      if(libre<-1e-9){const te=(x.t.fin||{})["Excepciones TRADE (4M$)"];warns.push(`${esc(short(x.t.name))}: cap superado en ${fmt(-libre)} M${te?` (tiene ${te} Excepciones de TRADE de 4 M)`:""}`)}
      if(n>max)warns.push(`${esc(short(x.t.name))}: ${n} jugadores (máx. ${max})`);
      const tag=x.t.abbr||short(x.t.name);
      return{warns,html:`<tr><td><b>${esc(tag)}</b></td><td class="num">${fmt(x.sent)}</td><td class="num">${fmt(y.sent)}</td><td class="num c-${level(libre)}">${fmt(x.t.libre)} → <b>${fmt(libre)}</b></td><td class="num${n>max?" c-bad":""}">${x.t.players.length} → <b>${n}</b></td></tr>`};
    });
    const yrs=D.teams.flatMap(x=>(x.picks||[]).map(p=>p.year)),cur=yrs.length?Math.min(...yrs):0;
    const V=[A,B].flatMap((x,ix)=>{
      if(!tr.ngm[ix?"b":"a"])return[];
      const tag=esc(short(x.t.name));
      return x.pk.filter(p=>p.rnd===1&&!p.from).flatMap(p=>{
        if(p.year===cur&&p.pick!=null&&p.pick<=15)return[`${tag}: 1ª ronda propia ${p.year} (#${p.pick}), pick 1–15: un nuevo GM no puede traspasarla si ya la tenía al hacerse cargo del equipo`];
        if(p.year===cur+1)return[`${tag}: 1ª ronda propia ${p.year}: un nuevo GM no puede traspasarla en sus 3 primeros meses`];
        return[];
      });
    });
    const W=rows.flatMap(r=>r.warns),cls=!any?"":(!ok||V.length)?"bad":W.length?"warn":"good";
    const v=!any?"Marca jugadores o picks para ver el resultado.":(ok&&V.length)?`✗ Restricción de picks para nuevo GM · salarios equiparados (diferencia ${fmt(diff)} M)`:ok?`${W.length?"⚠ Salarios equiparados, pero revisa cap/plantilla":"✓ Salarios equiparados"} · diferencia ${fmt(diff)} M (máx. ${fmt(tol)} M)`:`✗ No cumple salarios equiparados · diferencia ${fmt(diff)} M, máximo ${fmt(tol)} M`;
    if(any){
      const items=x=>[...x.out.map(p=>`• ${p.name} (${p.pos||"?"}) · ${fmt(p.sal)} M · ${p.yrs??"?"} año${p.yrs===1?"":"s"}`),...x.pk.map(p=>`• Pick ${p.year} R${p.rnd}${p.pick!=null?" #"+p.pick:""}${p.from?" (de "+short(p.from)+")":""}`),...x.rt.map(r=>`• Derechos: ${r.name}`)].join("\n")||"• (nada)";
      const lib=x=>x.t.libre+x.sent-(x===A?B:A).sent,nn=x=>x.t.players.length-x.out.length+(x===A?B:A).out.length,nm=x=>short(x.t.name);
      tradeText=[`*TRADE ${D.meta.liga||"DM10"}*`,"",`*${nm(A)}* envía:`,items(A),"",`*${nm(B)}* envía:`,items(B),"",
        `Salarios: ${fmt(A.sent)} M ⇄ ${fmt(B.sent)} M · diferencia ${fmt(diff)} M (máx. ${fmt(tol)} M) ${ok?"✓":"✗ no cumple salarios equiparados"}`,
        `Cap libre: ${nm(A)} ${fmt(A.t.libre)} → ${fmt(lib(A))} M · ${nm(B)} ${fmt(B.t.libre)} → ${fmt(lib(B))} M`,
        `Plantilla: ${nm(A)} ${A.t.players.length} → ${nn(A)} · ${nm(B)} ${B.t.players.length} → ${nn(B)}`,
        ...[...V,...W].map(w=>"⚠ "+w.replace(/&amp;/g,"&"))].join("\n");
    }
    sum=`<div class="tsum ${cls}"><div class="tv">${v}</div><table><thead><tr><th>Equipo</th><th class="num">Envía</th><th class="num">Recibe</th><th class="num">Libre M</th><th class="num">Jug.</th></tr></thead><tbody>${rows.map(r=>r.html).join("")}</tbody></table>${any?[...V,...W].map(w=>`<div class="tw">${w}</div>`).join(""):""}${any&&V.length?`<div class="note">El SubComisionado puede permitirlo de forma excepcional.</div>`:""}</div>`;
  }
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="tools"><button class="btn" data-act="swap">⇄ Intercambiar A y B</button><button class="btn" data-act="clear">Limpiar</button>${tradeText?`<button class="btn" data-act="copy">📋 Copiar resumen</button>${navigator.share?`<button class="btn" data-act="share">Compartir</button>`:""}`:""}</div>
  ${sum}${panel("a")}${panel("b")}
  <div class="note">Regla: la diferencia entre lo enviado por cada parte no puede superar el 25 % de la cantidad mayor, o 2 M como máximo. Picks y derechos no cuentan como salario. «Nuevo GM» se marca solo para los managers Rookie de la hoja Managers; puedes quitarlo (p. ej. pasados los 3 meses) o ponerlo a mano.</div>`;
}
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function libresView(){
  const k=fs.key,d=fs.dir,L=[...(D.libres||[])].sort((a,b)=>{
    const r=k==="name"?a.name.localeCompare(b.name,"es")*d:k==="pos"?prk(a.pos,b.pos,d):(nul(a[k],d)-nul(b[k],d))*d;
    return r||(b.fppg??-99)-(a.fppg??-99);
  });
  const ar=x=>fs.key===x?(fs.dir>0?" ↑":" ↓"):"";
  const rows=L.map(p=>`<tr><td class="c1">${pb(p.pos)}</td><td class="nm c2">${esc(p.name)}${p.inj?`<span class="pos">${esc(p.inj)}</span>`:""}</td>
   ${st(p)}<td class="num">${p.age??"–"}</td></tr>`).join("");
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>Agentes libres</h2><div class="big">${L.length} <span class="sub">sin equipo</span></div></div>
  <div class="tablebox p"><table class="wide"><thead><tr><th class="c1" data-f="pos">Pos.${ar("pos")}</th><th class="c2" data-f="name">Jugador${ar("name")}</th><th class="num" data-f="fppg">FPPG${ar("fppg")}</th><th class="num" data-f="fppm">FPPM${ar("fppm")}</th><th class="num" data-f="mpg">MPG${ar("mpg")}</th><th class="num" data-f="age">Edad${ar("age")}</th></tr></thead>
  <tbody>${rows||`<tr><td colspan="6" class="empty">No hay agentes libres.</td></tr>`}</tbody></table></div>`;
}
function searchView(){
  const toks=norm(query).split(/\s+/).filter(Boolean),first=norm(query).trim();
  const all=[...D.teams.flatMap(t=>t.players.map(p=>({...p,team:t}))),...(D.libres||[]).map(p=>({...p,team:null}))];
  let hits=all.filter(p=>(!pf.size||pf.has(String(p.pos).toUpperCase()))&&toks.every(x=>norm(p.name).includes(x)));
  const k=rs.key,d=rs.dir;
  hits.sort((a,b)=>{
    let r;
    if(k==="name")r=(norm(a.name).startsWith(first)?0:1)-(norm(b.name).startsWith(first)?0:1)||a.name.localeCompare(b.name,"es")*d;
    else if(k==="pos")r=prk(a.pos,b.pos,d);
    else if(k==="team")r=(a.team?short(a.team.name):"~").localeCompare(b.team?short(b.team.name):"~","es")*d;
    else{const v=p=>(k==="sal"||k==="yrs")&&!p.team?null:p[k];r=(nul(v(a),d)-nul(v(b),d))*d}
    return r||a.name.localeCompare(b.name,"es");
  });
  const MAX=200,ar=x=>rs.key===x?(rs.dir>0?" ↑":" ↓"):"";
  const rows=hits.slice(0,MAX).map(p=>`<tr><td class="c1">${pb(p.pos)}</td><td class="nm c2">${esc(p.name)}</td>
   <td class="nm">${p.team?`<a class="tl" href="#team=${encodeURIComponent(key(p.team))}">${esc(short(p.team.name))}</a>`:`<span class="libre">Libre</span>`}</td>
   <td class="num">${p.team?fmt(p.sal):"–"}</td><td class="num">${p.team?`<span class="badge y${p.yrs}">${p.yrs??"–"}</span>`:"–"}</td>${st(p)}</tr>`).join("");
  return `<div class="sub" style="margin-bottom:8px">${hits.length} resultado${hits.length===1?"":"s"}${pf.size?" · posición "+POS.filter(c=>pf.has(c)).join(" / "):""}${hits.length>MAX?` · mostrando los ${MAX} primeros, afina la búsqueda`:""}</div>
  <div class="tablebox p"><table class="wide"><thead><tr><th class="c1" data-r="pos">Pos.${ar("pos")}</th><th class="c2" data-r="name">Jugador${ar("name")}</th><th data-r="team">Equipo${ar("team")}</th><th class="num" data-r="sal">Sal. M${ar("sal")}</th><th class="num" data-r="yrs">Años${ar("yrs")}</th><th class="num" data-r="fppg">FPPG${ar("fppg")}</th><th class="num" data-r="fppm">FPPM${ar("fppm")}</th><th class="num" data-r="mpg">MPG${ar("mpg")}</th></tr></thead>
  <tbody>${rows||`<tr><td colspan="8" class="empty">Ningún jugador encontrado.</td></tr>`}</tbody></table></div>`;
}
function teamView(k){
  const t=D.teams.find(x=>key(x)===k);
  if(!t)return `<a class="btn" href="#">‹ Todos los equipos</a><p class="empty">Equipo no encontrado.</p>`;
  const cap=D.meta.cap,max=D.meta.rosterMax,P=psort(t.players,ps.key,ps.dir),ar=x=>ps.key===x?(ps.dir>0?" ↑":" ↓"):"";
  const tot=P.reduce((s,p)=>s+p.sal,0);
  const warn=P.length>max?`<div class="err">Más de ${max} jugadores en la plantilla.</div>`:t.libre<0?`<div class="err">Cap superado en ${fmt(-t.libre)} M.</div>`:"";
  const fin=Object.entries(t.fin||{}).map(([l,v])=>`<tr><td>${esc(l)}</td><td class="num">${fmt(v)} M</td></tr>`).join("");
  const th0=`<thead><tr><th class="ns">Pos.</th><th class="ns">Jugador</th><th class="num ns">Sal. M</th><th class="num ns">Años</th><th class="num ns">Edad</th></tr></thead>`;
  const th=`<thead><tr><th class="c1" data-p="pos">Pos.${ar("pos")}</th><th class="c2" data-p="name">Jugador${ar("name")}</th><th class="num" data-p="sal">Sal. M${ar("sal")}</th><th class="num" data-p="yrs">Años${ar("yrs")}</th><th class="num" data-p="age">Edad${ar("age")}</th><th class="num" data-p="fppg">FPPG${ar("fppg")}</th><th class="num" data-p="fppm">FPPM${ar("fppm")}</th><th class="num" data-p="mpg">MPG${ar("mpg")}</th></tr></thead>`;
  const cnt=POS.map(c=>[c,t.players.filter(p=>p.pos===c).length]).filter(x=>x[1]);
  const R=(t.rights||[]).length?`<h3>Derechos</h3><div class="tablebox p"><table>${th0}<tbody>${ptable(t.rights)}</tbody></table></div>`:"";
  const pk=[...(t.picks||[])].sort((a,b)=>a.year-b.year||a.rnd-b.rnd||(a.pick??999)-(b.pick??999));
  const PK=pk.length?`<h3>Picks</h3><div class="tablebox"><table><thead><tr><th class="ns">Ronda</th><th class="num ns">Pick</th><th class="ns">Origen</th><th class="num ns">Salario</th></tr></thead><tbody>${pk.map(p=>`<tr><td>${p.year} · R${p.rnd}</td><td class="num">${p.pick!=null?"#"+p.pick:"–"}</td>
   <td class="nm">${p.from?esc(short(p.from)):`<span class="empty">Propio</span>`}</td><td class="num">${p.sal!=null?fmt(p.sal)+" M":"–"}</td></tr>`).join("")}</tbody></table></div>`:"";
  const z=v=>v?fmt(v)+" M":"–";
  const CT=(t.cuts||[]).length?`<h3>Cortados</h3><div class="tablebox"><table><thead><tr><th class="ns">Jugador</th><th class="num ns">Ahora</th><th class="num ns">S+1</th><th class="num ns">S+2</th></tr></thead><tbody>${t.cuts.map(c=>`<tr><td class="nm">${esc(c.name)}</td><td class="num">${z(c.now)}</td><td class="num">${z(c.s1)}</td><td class="num">${z(c.s2)}</td></tr>`).join("")}</tbody></table></div>`:"";
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>${key(t)===mine?"★ ":""}${esc(short(t.name))}</h2><div class="sub">${esc(t.gm||"")}${t.rookie?" · Rookie":""}${t.record?" · Récord "+esc(t.record):""}</div>
   <div class="big c-${level(t.libre)}">${fmt(t.libre)} M <span class="sub">libre de ${fmt(cap,0)} M</span></div>${bar(t.libre,cap,10)}
   <div class="meta"><span>${P.length} de ${max} jugadores</span><span>Salarios ${fmt(t.salarios)} M</span></div>
   <div class="pcount">${cnt.map(([c,n])=>`${pb(c)}<span>${n}</span>`).join("")}</div>${warn}<div class="tools" style="margin:12px 0 0"><button class="btn" data-trade="${esc(key(t))}">⇄ Simular trade con este equipo</button><button class="btn" data-act="mine" data-k="${esc(key(t))}">${key(t)===mine?"★ Mi equipo":"☆ Marcar como mi equipo"}</button></div></div>
  <div class="tablebox p"><table class="wide">${th}<tbody>${ptable(P,true)||`<tr><td colspan="8" class="empty">Sin jugadores.</td></tr>`}</tbody>
   <tfoot><tr><td class="c1"></td><td class="c2">Total</td><td class="num">${fmt(tot)}</td><td></td><td></td><td></td><td></td><td></td></tr></tfoot></table></div>
  ${R}${PK}${CT}${fin?`<h3>Finanzas</h3><div class="tablebox"><table><tbody>${fin}</tbody></table></div>`:""}`;
}
function chips(){
  $("#chips").innerHTML=POS.map(c=>`<button class="chip${pf.has(c)?" on":""}" data-c="${c}">${c}</button>`).join("")+(pf.size?`<button class="chip" data-c="">✕</button>`:"");
}
function render(){
  if(!D)return;chips();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="trade"&&!tradePre){tradePre=true;if(mine&&!tr.a&&!tr.b&&tTeam(mine)){tr.a=mine;tr.ngm.a=!!tTeam(mine).rookie}}
  $("#app").innerHTML=(query.trim()||pf.size)?searchView():h.startsWith("team=")?teamView(h.slice(5)):h==="libres"?libresView():h==="trade"?tradeView():h==="cambios"?cambiosView():listView();
}
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-s]"),r=e.target.closest("tr[data-t]"),fh=e.target.closest("th[data-f]"),ph=e.target.closest("th[data-p]"),rh=e.target.closest("th[data-r]"),ch=e.target.closest("button[data-c]");
  const ac=e.target.closest("[data-act]"),tb=e.target.closest("[data-trade]");
  if(ac){
    const act=ac.dataset.act;
    if(act==="copy"){const old=ac.textContent;copyText(tradeText).then(ok=>{ac.textContent=ok?"✓ Copiado":"No se pudo copiar";setTimeout(()=>{ac.textContent=old},1800)})}
    else if(act==="share"){navigator.share({text:tradeText}).catch(()=>{})}
    else if(act==="mine"){setMine(mine===ac.dataset.k?"":ac.dataset.k);render()}
    else if(act==="onlymine"){cs.mine=!cs.mine;render()}
    else{
      if(act==="swap"){[tr.a,tr.b]=[tr.b,tr.a];[tr.sel.a,tr.sel.b]=[tr.sel.b,tr.sel.a];[tr.ngm.a,tr.ngm.b]=[tr.ngm.b,tr.ngm.a]}
      else tr={a:"",b:"",sel:{a:new Set(),b:new Set()},ngm:{a:false,b:false}};
      render();
    }
  }
  else if(tb){const k=tb.dataset.trade;if(tr.b===k){tr.b="";tr.sel.b=new Set();tr.ngm.b=false}if(tr.a!==k){tr.a=k;tr.sel.a=new Set();tr.ngm.a=!!(tTeam(k)||{}).rookie}location.hash="trade"}
  else if(ch){const c=ch.dataset.c;if(!c)pf=new Set();else pf.has(c)?pf.delete(c):pf.add(c);render()}
  else if(ph){const k=ph.dataset.p;ps=ps.key===k?{key:k,dir:-ps.dir}:{key:k,dir:pdir(k)};render()}
  else if(rh){const k=rh.dataset.r;rs=rs.key===k?{key:k,dir:-rs.dir}:{key:k,dir:k==="name"||k==="pos"||k==="team"?1:-1};render()}
  else if(fh){const k=fh.dataset.f;fs=fs.key===k?{key:k,dir:-fs.dir}:{key:k,dir:k==="name"||k==="age"||k==="pos"?1:-1};render()}
  else if(th){const k=th.dataset.s;sort=sort.key===k?{key:k,dir:-sort.dir}:{key:k,dir:k==="name"?1:-1};render()}
  else if(r)location.hash="team="+encodeURIComponent(r.dataset.t);
});
document.addEventListener("change",e=>{
  const c=e.target.closest("input[data-s]"),s=e.target.closest("select[data-sel]"),g=e.target.closest("input[data-ngm]");
  if(g){tr.ngm[g.dataset.ngm]=g.checked;render()}
  else if(c){const S=tr.sel[c.dataset.s];S.has(c.dataset.i)?S.delete(c.dataset.i):S.add(c.dataset.i);render()}
  else if(s){tr[s.dataset.sel]=s.value;tr.sel[s.dataset.sel]=new Set();tr.ngm[s.dataset.sel]=!!(tTeam(s.value)||{}).rookie;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest&&e.target.closest("tr[data-t]");if(r)location.hash="team="+encodeURIComponent(r.dataset.t)}});
window.addEventListener("hashchange",()=>{query="";pf=new Set();$("#q").value="";render();scrollTo(0,0)});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>{
  D=j;D.teams.forEach(t=>t.n=t.players.length);
  $("#t").textContent=D.meta.liga||"DM10";
  $("#status").textContent=[D.meta.temporada&&"Temporada "+D.meta.temporada,D.meta.stand&&"Estado: "+D.meta.stand].filter(Boolean).join(" · ");
  if(!location.hash&&mine&&tTeam(mine))history.replaceState(null,"","#team="+encodeURIComponent(mine));
  render();
}).catch(e=>{$("#status").textContent="";$("#app").innerHTML=`<p class="err">No se pudo cargar data.json (${esc(e.message)}).</p>`});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
