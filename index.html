<style>
:root{--paper:#f7f0e6;--card:#fffaf2;--ink:#2a190c;--muted:#7a6551;--line:#e2d3bf;--acc:#b0621f;--acc-d:#7a3f0e;--good:#3f7d3a;--warn:#b07d0a;--bad:#b3341f;
--title:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#1d130b;--card:#2a1d12;--ink:#f3e7d8;--muted:#b9a58f;--line:#43301f;--acc:#e0924a;--acc-d:#f2b27a;--good:#7bc477;--warn:#e6b84a;--bad:#ee7d6c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:54px;height:54px;border-radius:10px;flex:none}
h1{font:700 38px/1 var(--title);margin:0}.sub{color:var(--muted);font-size:14px;margin-top:3px}
a{color:inherit}
#q{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:12px}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}
.kpilink{text-decoration:none;color:inherit;border-color:var(--acc);cursor:pointer}.kpilink:hover{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
a.tl{color:var(--acc-d);font-weight:600;text-decoration:none}
.libre{display:inline-block;font:600 12px var(--body);padding:2px 8px;border-radius:99px;color:var(--good);border:1px solid var(--good)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 28px/1.05 var(--title);font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:14px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 14px var(--body);color:var(--muted);cursor:pointer;user-select:none;background:var(--card)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}th.ns{cursor:default}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
td.nm{white-space:normal;min-width:90px;overflow-wrap:anywhere}
.tablebox.l th,.tablebox.l td{padding:10px 6px}
.team{font:600 19px/1.05 var(--title);letter-spacing:.3px;display:block}.gm{color:var(--muted);font-size:12px}
.pos{display:block;color:var(--muted);font-size:12px}
.free{font:700 21px/1 var(--title)}.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
.bg-warn i{background:var(--warn)}.bg-bad i{background:var(--bad)}
.badge{display:inline-block;min-width:26px;text-align:center;font:600 13px var(--body);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.y1{background:color-mix(in srgb,var(--warn) 20%,transparent)}.y2{background:color-mix(in srgb,var(--acc) 16%,transparent)}.y3{background:color-mix(in srgb,var(--good) 22%,transparent)}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;text-decoration:none;display:inline-block;margin-bottom:12px}
.head{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.head h2{font:700 34px/1 var(--title);margin:0 0 4px}.head .big{font:700 44px/1 var(--title);font-variant-numeric:tabular-nums;margin-top:10px}
.head .bar{height:10px;border-radius:5px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:8px}
h3{font:700 22px/1 var(--title);margin:18px 0 8px;letter-spacing:.3px}
tfoot td{font-weight:600;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.empty{color:var(--muted);font-style:italic}.note{color:var(--muted);font-size:13px}.err{color:var(--bad);font-weight:600}
</style>
</head>

<input id="q" type="search" placeholder="Buscar jugador…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar jugador">
<main id="app"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=1)=>Number(n).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,sort={key:"name",dir:1},fs={key:"fppg",dir:-1},query="";
const level=f=>f<=0?"bad":f<=10?"warn":"good";
const bar=(f,cap,h)=>{const l=level(f);return `<div class="bar ${l==="good"?"":"bg-"+l}" ${h?`style="height:${h}px"`:""}><i style="width:${Math.max(0,Math.min(100,f/cap*100))}%"></i></div>`};
const short=n=>String(n).replace(/\s*\([^)]*\)\s*$/,"");
const key=t=>t.abbr||t.name;

function listView(){
  const cap=D.meta.cap,T=[...D.teams],k=sort.key,d=sort.dir;
  T.sort((a,b)=>k==="name"?short(a.name).localeCompare(short(b.name),"es")*d:((a[k]??0)-(b[k]??0))*d);
  const arrow=x=>sort.key===x?(sort.dir>0?" ↑":" ↓"):"";
  const avg=T.reduce((s,t)=>s+t.libre,0)/(T.length||1);
  const rows=T.map(t=>`<tr class="row" tabindex="0" data-t="${esc(key(t))}">
   <td class="nm"><span class="team">${esc(short(t.name))}</span><span class="gm">${esc(t.gm||"")}</span></td>
   <td class="num">${fmt(t.salarios)}</td>
   <td class="num"><span class="free c-${level(t.libre)}">${fmt(t.libre)}</span>${bar(t.libre,cap)}</td>
   <td class="num">${t.players.length}<span class="empty"> / ${D.meta.rosterMax}</span></td></tr>`).join("");
  return `<div class="kpis"><div class="kpi"><b>${T.length}</b><span>Equipos</span></div>
   <div class="kpi"><b>${fmt(avg)} M</b><span>Libre medio</span></div><a class="kpi kpilink" href="#libres"><b>${(D.libres||[]).length}</b><span>Agentes libres ›</span></a></div>
  <div class="tablebox l"><table><thead><tr><th data-s="name">Equipo${arrow("name")}</th><th class="num" data-s="salarios">Sal. M${arrow("salarios")}</th>
   <th class="num" data-s="libre">Libre M${arrow("libre")}</th><th class="num" data-s="n">Jug.${arrow("n")}</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note">Toca un equipo para ver su plantilla. Pulsa las cabeceras para ordenar.</div>`;
}
function ptable(list,first){
  return list.map(p=>`<tr><td class="nm">${esc(p.name)}<span class="pos">${esc(p.pos||"")}</span></td>
   <td class="num">${fmt(p.sal)} M</td><td class="num"><span class="badge y${p.yrs}">${p.yrs??"–"}</span></td><td class="num">${p.age??"–"}</td></tr>`).join("");
}
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function libresView(){
  const L=[...(D.libres||[])],k=fs.key,d=fs.dir;
  L.sort((a,b)=>k==="name"?a.name.localeCompare(b.name,"es")*d:((a[k]??(d>0?999:-999))-(b[k]??(d>0?999:-999)))*d);
  const ar=x=>fs.key===x?(fs.dir>0?" ↑":" ↓"):"";
  const rows=L.map(p=>`<tr><td class="nm">${esc(p.name)}<span class="pos">${esc(p.pos||"")}${p.inj?" · "+esc(p.inj):""}</span></td>
   <td class="num">${p.fppg!=null?fmt(p.fppg):"–"}</td><td class="num">${p.fppm!=null?fmt(p.fppm,2):"–"}</td><td class="num">${p.age??"–"}</td></tr>`).join("");
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>Agentes libres</h2><div class="big">${L.length} <span class="sub">sin equipo</span></div></div>
  <div class="tablebox"><table><thead><tr><th data-f="name">Jugador${ar("name")}</th><th class="num" data-f="fppg">FPPG${ar("fppg")}</th><th class="num" data-f="fppm">FPPM${ar("fppm")}</th><th class="num" data-f="age">Edad${ar("age")}</th></tr></thead>
  <tbody>${rows||`<tr><td colspan="4" class="empty">No hay agentes libres.</td></tr>`}</tbody></table></div>`;
}
function searchView(){
  const toks=norm(query).split(/\s+/).filter(Boolean),first=norm(query).trim();
  const all=[...D.teams.flatMap(t=>t.players.map(p=>({...p,team:t}))),...(D.libres||[]).map(p=>({...p,team:null}))];
  const hits=all.filter(p=>{const n=norm(p.name);return toks.every(x=>n.includes(x))});
  hits.sort((a,b)=>(norm(a.name).startsWith(first)?0:1)-(norm(b.name).startsWith(first)?0:1)||a.name.localeCompare(b.name,"es"));
  const rows=hits.slice(0,100).map(p=>`<tr><td class="nm">${esc(p.name)}<span class="pos">${esc(p.pos||"")}</span></td>
   <td class="nm">${p.team?`<a class="tl" href="#team=${encodeURIComponent(key(p.team))}">${esc(short(p.team.name))}</a>`:`<span class="libre">Libre</span>`}</td>
   <td class="num">${p.team?fmt(p.sal)+" M":"–"}</td><td class="num">${p.team?`<span class="badge y${p.yrs}">${p.yrs??"–"}</span>`:"–"}</td></tr>`).join("");
  return `<div class="sub" style="margin-bottom:8px">${hits.length} resultado${hits.length===1?"":"s"}${hits.length>100?" · mostrando los 100 primeros, afina la búsqueda":""}</div>
  <div class="tablebox"><table><thead><tr><th class="ns">Jugador</th><th class="ns">Equipo</th><th class="num ns">Salario</th><th class="num ns">Años</th></tr></thead>
  <tbody>${rows||`<tr><td colspan="4" class="empty">Ningún jugador encontrado.</td></tr>`}</tbody></table></div>`;
}
function teamView(k){
  const t=D.teams.find(x=>key(x)===k);
  if(!t)return `<a class="btn" href="#">‹ Todos los equipos</a><p class="empty">Equipo no encontrado.</p>`;
  const cap=D.meta.cap,max=D.meta.rosterMax,P=[...t.players].sort((a,b)=>b.sal-a.sal||a.name.localeCompare(b.name,"es"));
  const tot=P.reduce((s,p)=>s+p.sal,0);
  const warn=P.length>max?`<div class="err">Más de ${max} jugadores en la plantilla.</div>`:t.libre<0?`<div class="err">Cap superado en ${fmt(-t.libre)} M.</div>`:"";
  const fin=Object.entries(t.fin||{}).map(([l,v])=>`<tr><td>${esc(l)}</td><td class="num">${fmt(v)} M</td></tr>`).join("");
  const th=`<thead><tr><th class="ns">Jugador</th><th class="num ns">Salario</th><th class="num ns">Años</th><th class="num ns">Edad</th></tr></thead>`;
  const R=(t.rights||[]).length?`<h3>Derechos</h3><div class="tablebox"><table>${th}<tbody>${ptable(t.rights)}</tbody></table></div>`:"";
  const pk=[...(t.picks||[])].sort((a,b)=>a.year-b.year||a.rnd-b.rnd||(a.pick??999)-(b.pick??999));
  const PK=pk.length?`<h3>Picks</h3><div class="tablebox"><table><thead><tr><th class="ns">Ronda</th><th class="num ns">Pick</th><th class="ns">Origen</th><th class="num ns">Salario</th></tr></thead><tbody>${pk.map(p=>`<tr><td>${p.year} · R${p.rnd}</td><td class="num">${p.pick!=null?"#"+p.pick:"–"}</td>
   <td class="nm">${p.from?esc(short(p.from)):`<span class="empty">Propio</span>`}</td><td class="num">${p.sal!=null?fmt(p.sal)+" M":"–"}</td></tr>`).join("")}</tbody></table></div>`:"";
  const z=v=>v?fmt(v)+" M":"–";
  const CT=(t.cuts||[]).length?`<h3>Cortados</h3><div class="tablebox"><table><thead><tr><th class="ns">Jugador</th><th class="num ns">Ahora</th><th class="num ns">S+1</th><th class="num ns">S+2</th></tr></thead><tbody>${t.cuts.map(c=>`<tr><td class="nm">${esc(c.name)}</td><td class="num">${z(c.now)}</td><td class="num">${z(c.s1)}</td><td class="num">${z(c.s2)}</td></tr>`).join("")}</tbody></table></div>`:"";
  return `<a class="btn" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>${esc(short(t.name))}</h2><div class="sub">${esc(t.gm||"")}${t.record?" · Récord "+esc(t.record):""}</div>
   <div class="big c-${level(t.libre)}">${fmt(t.libre)} M <span class="sub">libre de ${fmt(cap,0)} M</span></div>${bar(t.libre,cap,10)}
   <div class="meta"><span>${P.length} de ${max} jugadores</span><span>Salarios ${fmt(t.salarios)} M</span></div>${warn}</div>
  <div class="tablebox"><table>${th}<tbody>${ptable(P)||`<tr><td colspan="4" class="empty">Sin jugadores.</td></tr>`}</tbody>
   <tfoot><tr><td>Total</td><td class="num">${fmt(tot)} M</td><td></td><td></td></tr></tfoot></table></div>
  ${R}${PK}${CT}${fin?`<h3>Finanzas</h3><div class="tablebox"><table><tbody>${fin}</tbody></table></div>`:""}`;
}
function render(){
  if(!D)return;
  const h=decodeURIComponent(location.hash.slice(1));
  $("#app").innerHTML=query.trim()?searchView():h.startsWith("team=")?teamView(h.slice(5)):h==="libres"?libresView():listView();
}
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-s]"),r=e.target.closest("tr[data-t]"),fh=e.target.closest("th[data-f]");
  if(fh){const k=fh.dataset.f;fs=fs.key===k?{key:k,dir:-fs.dir}:{key:k,dir:k==="name"||k==="age"?1:-1};render()}
  else if(th){const k=th.dataset.s;sort=sort.key===k?{key:k,dir:-sort.dir}:{key:k,dir:k==="name"?1:-1};render()}
  else if(r)location.hash="team="+encodeURIComponent(r.dataset.t);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest&&e.target.closest("tr[data-t]");if(r)location.hash="team="+encodeURIComponent(r.dataset.t)}});
window.addEventListener("hashchange",()=>{query="";$("#q").value="";render();scrollTo(0,0)});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
fetch("data.json?_="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>{
  D=j;D.teams.forEach(t=>t.n=t.players.length);
  $("#t").textContent=D.meta.liga||"DM10";
  $("#status").textContent=[D.meta.temporada&&"Temporada "+D.meta.temporada,D.meta.stand&&"Estado: "+D.meta.stand].filter(Boolean).join(" · ");
  render();
}).catch(e=>{$("#status").textContent="";$("#app").innerHTML=`<p class="err">No se pudo cargar data.json (${esc(e.message)}).</p>`});
</script>
</body>
</html>
