<style>
:root{--paper:#f7f0e6;--card:#fffaf2;--ink:#2a190c;--muted:#7a6551;--line:#e2d3bf;--acc:#b0621f;--bad:#b3341f;--good:#3f7d3a}
@media (prefers-color-scheme:dark){:root{--paper:#1d130b;--card:#2a1d12;--ink:#f3e7d8;--muted:#b9a58f;--line:#43301f;--acc:#e0924a;--bad:#ee7d6c;--good:#7bc477}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}h1{font-size:26px;margin:0 0 6px}
p{margin:8px 0}.muted{color:var(--muted);font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
input[type=file]{width:100%;padding:18px 10px;border:2px dashed var(--acc);border-radius:10px;background:transparent;color:var(--ink)}
input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:16px}
button{font:600 16px system-ui;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:11px 16px;width:100%;cursor:pointer}
button:disabled{opacity:.4;cursor:default}.err{color:var(--bad);font-weight:600}.ok{color:var(--good);font-weight:600}
</style>
</head>
<body><div class="wrap">
<h1>Actualizar datos de la liga</h1>
<p class="muted">1. Elige el Excel de la liga (.xlsx / .xlsm). 2. Descarga <b>data.json</b>. 3. Sustituye <b>data.json</b> en GitHub: la app se actualiza sola. El Excel no sale de tu dispositivo.</p>
<div class="box"><input id="f" type="file" accept=".xlsx,.xlsm"><div id="msg" class="muted" style="margin-top:10px"></div></div>
<div class="box" id="res" hidden>
  <label class="muted">Estado mostrado en la app</label><input id="stand" type="text">
  <p id="sum"></p>
  <button id="dl">Descargar data.json</button>
</div>
</div>
<script>
const CONFIG={liga:"DM10",cap:120,rosterMax:14,hoja:"ROSTERS",hojaLibres:"AGENTES LIBRES"};
const td=new TextDecoder();
/* ---- ZIP (solo lo necesario) ---- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("No es un archivo Excel válido");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const ents={};
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    ents[name]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+el+cl;
  }
  return async name=>{
    const en=ents[name];if(!en)return null;
    const lo=en.off,s=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u8.subarray(s,s+en.cs);
    if(en.m===0)return td.decode(raw);
    const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(raw);w.close();
    return td.decode(await new Response(ds.readable).arrayBuffer());
  };
}
const dec=s=>s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g,(m,x)=>x==="amp"?"&":x==="lt"?"<":x==="gt"?">":x==="quot"?'"':x==="apos"?"'":String.fromCodePoint(x[1]==="x"?parseInt(x.slice(2),16):parseInt(x.slice(1),10)));
const colIdx=l=>{let n=0;for(const ch of l)n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readSheet(get,name){
  const wb=await get("xl/workbook.xml"),rel=await get("xl/_rels/workbook.xml.rels");
  let rid=null;for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){const nm=/name="([^"]*)"/.exec(m[0]);if(nm&&dec(nm[1])===name)rid=/r:id="([^"]*)"/.exec(m[0])[1]}
  if(!rid)throw new Error("No encuentro la hoja "+name);
  let tgt=null;for(const m of rel.matchAll(/<Relationship\b[^>]*>/g)){if(new RegExp('Id="'+rid+'"').test(m[0]))tgt=/Target="([^"]*)"/.exec(m[0])[1]}
  const path=tgt.startsWith("/")?tgt.slice(1):"xl/"+tgt;
  const ss=[],sx=await get("xl/sharedStrings.xml");
  if(sx)for(const m of sx.matchAll(/<si>([\s\S]*?)<\/si>/g)){let t="";for(const x of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g))t+=x[1];ss.push(dec(t))}
  const xml=await get(path),rows={};
  for(const m of xml.matchAll(/<c r="([A-Z]+)(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    if(!m[4])continue;const t=/\bt="(\w+)"/.exec(m[3]),v=/<v>([\s\S]*?)<\/v>/.exec(m[4]);let val=null;
    if(t&&t[1]==="inlineStr"){const x=/<t[^>]*>([\s\S]*?)<\/t>/.exec(m[4]);val=x?dec(x[1]):null}
    else if(!v)continue;
    else if(!t||t[1]==="n")val=parseFloat(v[1]);
    else if(t[1]==="s")val=ss[+v[1]];
    else if(t[1]==="str")val=dec(v[1]);
    else if(t[1]==="b")val=v[1]==="1";
    else continue; /* errores (#N/A ...) */
    (rows[+m[2]]||(rows[+m[2]]={}))[colIdx(m[1])]=val;
  }
  return rows;
}
/* ---- Extraer equipos de ROSTERS ---- */
const isStr=v=>typeof v==="string"&&v.trim()!=="";
const num=v=>typeof v==="number"&&isFinite(v)?v:null;
function extract(rows){
  const teams=[];let cur=null,zone=null,fin=false,cut=false;
  const maxR=Math.max(...Object.keys(rows).map(Number));
  for(let r=1;r<=maxR;r++){
    const R=rows[r];if(!R)continue;
    if(/^DM\d+$/.test(R[1]||"")&&/^\d+\s*-\s*\d+$/.test(R[2]||"")&&isStr(R[20])){
      cur={abbr:R[3]||"",name:R[20].trim(),gm:((/\(([^)]*)\)\s*$/.exec(R[20])||[])[1]||""),record:R[2],fin:{},players:[],rights:[],picks:[],cuts:[]};
      teams.push(cur);zone="players";fin=false;cut=false;continue;
    }
    if(!cur)continue;
    if(R[20]==="Información Financiera"){fin=true}
    else if(fin&&isStr(R[20])){
      if(/^Información/.test(R[20]))fin=false;
      else if(num(R[21])!==null)cur.fin[R[20].trim()]=Math.round(R[21]*100)/100;
    }
    if(num(R[14])!==null&&R[14]>=1&&num(R[15])!==null&&R[15]>=2000&&isStr(R[16])){
      const own=R[16].trim()===cur.name;
      cur.picks.push({rnd:R[14],year:R[15],from:own?"":R[16].trim(),pick:num(R[17]),sal:num(R[18])});
    }
    if(isStr(R[16])&&/^CORTADOS/.test(R[16])){cut=true}
    if(cut&&R[15]==="TEAM")cut=false;
    if(cut&&isStr(R[16])&&!/^CORTADOS/.test(R[16])){
      const c=num(R[15])||0,a=num(R[17])||0,b=num(R[18])||0;
      cur.cuts.push({name:R[16].trim(),now:Math.round(c*100)/100,s1:Math.round(a*100)/100,s2:Math.round(b*100)/100});
    }
    if(isStr(R[2])&&/^DERECHOS/.test(R[2])){zone="rights";continue}
    if(isStr(R[2])&&R[2]!=="Jugador"&&num(R[3])!==null){
      const p={name:R[2].trim(),pos:isStr(R[1])?R[1]:"",sal:Math.round(R[3]*100)/100,yrs:num(R[4]),age:num(R[6]),fppg:num(R[7])};
      if(zone==="players")cur.players.push(p);else if(zone==="rights")cur.rights.push({name:p.name,pos:p.pos,sal:p.sal,yrs:p.yrs,age:p.age});
    }
  }
  return teams.map(t=>{
    const g=k=>Object.entries(t.fin).find(([l])=>l.toUpperCase().startsWith(k))?.[1];
    const sal=g("SALARIOS")??t.players.reduce((s,p)=>s+p.sal,0),libre=g("DINERO DISPONIBLE")??Math.round((CONFIG.cap-sal)*100)/100;
    return{...t,salarios:sal,libre};
  });
}
function extractLibres(rows){
  const H=rows[1]||{},ix={};for(const[k,v]of Object.entries(H))if(typeof v==="string")ix[v.trim()]=+k;
  if(ix["Jugador"]===undefined)throw new Error("Columna Jugador no encontrada");
  const g=(R,n)=>ix[n]===undefined?null:R[ix[n]],out=[],maxR=Math.max(...Object.keys(rows).map(Number));
  for(let r=2;r<=maxR;r++){
    const R=rows[r];if(!R)continue;const nm=g(R,"Jugador");if(!isStr(nm))continue;
    const tm=g(R,"TEAM");if(isStr(tm)&&/^DM\d+\s*-/.test(tm))continue; /* ya tiene equipo */
    const pos=g(R,"L. DM"),inj=g(R,"Lesión del jugador");
    out.push({name:nm.trim(),pos:isStr(pos)?pos.trim():"",fppg:num(g(R,"FPPG")),fppm:num(g(R,"FPPM")),age:num(g(R,"Edad")),inj:isStr(inj)?inj.trim():""});
  }
  return out.sort((a,b)=>(b.fppg??-99)-(a.fppg??-99));
}
function standFromName(n){
  const m=/(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre)[_ ]+(\d{1,2})/i.exec(n);
  return m?`${+m[2]} de ${m[1].toLowerCase()}`:"";
}
let out=null;
$=s=>document.querySelector(s);
$("#f").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  $("#res").hidden=true;$("#msg").className="muted";$("#msg").textContent="Leyendo…";
  try{
    const get=await unzip(await file.arrayBuffer());
    const teams=extract(await readSheet(get,CONFIG.hoja));
    if(!teams.length)throw new Error("No se han encontrado equipos en la hoja "+CONFIG.hoja);
    let libres=[],avisoL="";
    try{libres=extractLibres(await readSheet(get,CONFIG.hojaLibres))}catch(err){avisoL=" (agentes libres: "+err.message+")"}
    const season=/Season_(\d{4})_(\d{4})/.exec(file.name);
    out={libres,meta:{liga:CONFIG.liga,temporada:season?`${season[1]}-${season[2].slice(2)}`:"",stand:"",cap:CONFIG.cap,rosterMax:CONFIG.rosterMax},teams};
    $("#stand").value=standFromName(file.name)||new Date(file.lastModified).toLocaleDateString("es-ES",{day:"numeric",month:"long"});
    const np=teams.reduce((s,t)=>s+t.players.length,0);
    const nk=teams.reduce((s,t)=>s+t.picks.length,0);
    $("#sum").innerHTML=`<span class="ok">${teams.length} equipos, ${np} jugadores, ${nk} picks, ${libres.length} agentes libres</span>${avisoL?`<br><span class="err">${avisoL}</span>`:""}<br><span class="muted">${teams.slice(0,3).map(t=>t.name.replace(/\s*\(.*\)/,"")).join(", ")}…</span>`;
    $("#msg").textContent=file.name;$("#res").hidden=false;
  }catch(err){$("#msg").className="err";$("#msg").textContent="Error: "+err.message}
});
$("#dl").addEventListener("click",()=>{
  out.meta.stand=$("#stand").value.trim();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
  a.download="data.json";document.body.appendChild(a);a.click();a.remove();
});
</script>
</body>
</html>
